name: Publish

on:
  push:
    tags:
      - '*.*.*.*'
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true
      
      - name: Get Environment Variables
        run: |
          $tag = "${{ github.ref }}" -replace '^refs/tags/v?', ''

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages for HBR
        run: dotnet restore HuntBuddy/HuntBuddyReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release HuntBuddy/HuntBuddyReborn.csproj -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:PackageVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build
        
      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/HuntBuddyReborn/latest.zip
          token: ${{ secrets.GITHUB_TOKEN }}
